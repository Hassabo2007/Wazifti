name: V1.15 database migration smoke test

on:
  pull_request:
    paths:
      - "supabase/migrations/20261110100000_v1_15_security_performance_hygiene.sql"
      - ".github/workflows/v1-15-database-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-smoke-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wazifti_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wazifti_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare schema-faithful isolated fixture from live Supabase metadata
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d wazifti_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE SCHEMA auth;
          CREATE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE
            AS $$ SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid $$;

          CREATE TABLE public.companies (
            id uuid PRIMARY KEY,
            owner_id uuid NOT NULL
          );
          CREATE TABLE public.jobs (
            id uuid PRIMARY KEY,
            company_id uuid REFERENCES public.companies(id),
            poster_type text NOT NULL CHECK (poster_type IN ('company','individual')),
            posted_by_user_id uuid
          );
          CREATE TABLE public.applications (
            id uuid PRIMARY KEY,
            job_id uuid NOT NULL REFERENCES public.jobs(id),
            candidate_id uuid NOT NULL
          );
          CREATE TABLE public.in_app_notifications (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            application_id uuid NOT NULL
          );
          CREATE TABLE public.job_messages (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            application_id uuid NOT NULL REFERENCES public.applications(id),
            job_id uuid NOT NULL REFERENCES public.jobs(id),
            candidate_id uuid NOT NULL,
            poster_id uuid NOT NULL,
            sender_id uuid NOT NULL,
            recipient_id uuid NOT NULL,
            body text NOT NULL,
            created_at timestamptz NOT NULL DEFAULT now(),
            read_at timestamptz
          );
          ALTER TABLE public.job_messages ENABLE ROW LEVEL SECURITY;
          CREATE POLICY "Recipients mark own messages read" ON public.job_messages
            FOR UPDATE TO authenticated
            USING (recipient_id = (SELECT auth.uid()))
            WITH CHECK (recipient_id = (SELECT auth.uid()));
          SQL

      - name: Apply V1.15 migration to disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d wazifti_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261110100000_v1_15_security_performance_hygiene.sql

      - name: Assert indexes and RLS policies
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d wazifti_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            expected text[] := ARRAY[
              'in_app_notifications_application_id_idx',
              'job_messages_application_id_idx',
              'job_messages_candidate_id_idx',
              'job_messages_poster_id_idx',
              'job_messages_sender_id_idx'
            ];
            item text;
          BEGIN
            FOREACH item IN ARRAY expected LOOP
              IF NOT EXISTS (SELECT 1 FROM pg_indexes WHERE schemaname='public' AND indexname=item) THEN
                RAISE EXCEPTION 'Missing expected index: %', item;
              END IF;
            END LOOP;

            IF (SELECT count(*) FROM pg_policies
                WHERE schemaname='public' AND tablename='job_messages'
                  AND policyname IN ('Conversation participants read messages','Conversation participants send messages')
                  AND roles @> ARRAY['authenticated']::name[]) <> 2 THEN
              RAISE EXCEPTION 'Expected both authenticated participant policies';
            END IF;

            IF NOT EXISTS (SELECT 1 FROM pg_policies WHERE schemaname='public'
              AND tablename='job_messages' AND policyname='Recipients mark own messages read'
              AND cmd='UPDATE') THEN
              RAISE EXCEPTION 'Existing UPDATE policy was not preserved';
            END IF;
          END $$;
          SQL
