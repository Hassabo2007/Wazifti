name: V1.16 administrator audit migration — PostgreSQL 17

on:
  push:
    branches:
      - "feature/v1.16-admin-audit-trail"
    paths:
      - "tests/postgres17/v1_16_admin_audit_trail.sql"
      - "tests/postgres17/assert_v1_16_admin_audit_trail.sql"
      - "supabase/migrations/*_v1_16_admin_audit_trail.sql"
      - ".github/workflows/v1-16-admin-audit.yml"
  pull_request:
    paths:
      - "tests/postgres17/v1_16_admin_audit_trail.sql"
      - "tests/postgres17/assert_v1_16_admin_audit_trail.sql"
      - "supabase/migrations/*_v1_16_admin_audit_trail.sql"
      - ".github/workflows/v1-16-admin-audit.yml"

permissions:
  contents: write

jobs:
  generate-migration:
    runs-on: ubuntu-latest
    outputs:
      migration_file: ${{ steps.migration.outputs.file }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Generate migration with Supabase CLI or verify committed output
        id: migration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v1-16-admin-audit"
          mapfile -t existing < <(find supabase/migrations -maxdepth 1 -type f -name '*_v1_16_admin_audit_trail.sql' | sort)
          if [ "${#existing[@]}" -gt 1 ]; then
            echo "More than one V1.16 audit migration file exists." >&2
            exit 1
          fi
          if [ "${#existing[@]}" -eq 0 ]; then
            supabase migration new v1_16_admin_audit_trail
            mapfile -t generated < <(find supabase/migrations -maxdepth 1 -type f -name '*_v1_16_admin_audit_trail.sql' | sort)
            if [ "${#generated[@]}" -ne 1 ]; then
              echo "Supabase CLI did not generate exactly one migration file." >&2
              exit 1
            fi
            cp tests/postgres17/v1_16_admin_audit_trail.sql "${generated[0]}"
            migration_file="${generated[0]}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$migration_file"
            git commit -m "chore(db): add CLI-generated V1.16 audit migration"
            git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          else
            migration_file="${existing[0]}"
            if ! cmp -s tests/postgres17/v1_16_admin_audit_trail.sql "$migration_file"; then
              echo "Committed migration differs from the tested SQL source." >&2
              exit 1
            fi
          fi
          cp "$migration_file" "$RUNNER_TEMP/v1-16-admin-audit/"
          echo "file=$migration_file" >> "$GITHUB_OUTPUT"
          echo "Supabase CLI migration path: $migration_file"
      - uses: actions/upload-artifact@v4
        with:
          name: v1-16-admin-audit-migration
          path: ${{ runner.temp }}/v1-16-admin-audit/
          if-no-files-found: error
          retention-days: 14

  postgres17-full-history:
    needs: generate-migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create isolated PostgreSQL database
        env:
          PGPASSWORD: postgres
        run: createdb -h localhost -U postgres wazifti_audit_test
      - name: Apply recovered manual bootstrap and pre-ledger CV prerequisites
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d wazifti_audit_test -v ON_ERROR_STOP=1 -f tests/postgres17/manual_bootstrap_fixture.sql
      - name: Prepare local Vault stand-in
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d wazifti_audit_test -v ON_ERROR_STOP=1 -f tests/postgres17/historical_replay_prerequisites.sql
      - name: Export captured applied production migration SQL
        run: python scripts/export_recovered_migrations.py --output-dir "$RUNNER_TEMP/wazifti-recovered-migrations"
      - name: Replay 24 supported historical migrations (two Supabase-managed migrations excluded)
        env:
          PGPASSWORD: postgres
        run: python scripts/replay_recovered_migrations_pg17.py --input-dir "$RUNNER_TEMP/wazifti-recovered-migrations" --database wazifti_audit_test
      - name: Apply the production-applied V1.15 migration to reach current schema state
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d wazifti_audit_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261110173838_v1_15_security_performance_hygiene.sql
      - uses: actions/download-artifact@v4
        with:
          name: v1-16-admin-audit-migration
          path: ${{ runner.temp }}/v1-16-admin-audit-migration
      - name: Apply the CLI-generated V1.16 audit migration
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          migration_file="$(find "$RUNNER_TEMP/v1-16-admin-audit-migration" -maxdepth 1 -type f -name '*_v1_16_admin_audit_trail.sql' -print -quit)"
          test -n "$migration_file"
          psql -h localhost -U postgres -d wazifti_audit_test -v ON_ERROR_STOP=1 -f "$migration_file"
      - name: Verify audit security, hiring correlation, append-only behavior, and atomic rollback
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d wazifti_audit_test -v ON_ERROR_STOP=1 -f tests/postgres17/assert_v1_16_admin_audit_trail.sql
