name: V1.15 job message RLS behavior

on:
  pull_request:
    paths:
      - "supabase/migrations/20261110100000_v1_15_security_performance_hygiene.sql"
      - "supabase/tests/v1_15_job_messages_rls.sql"
      - ".github/workflows/v1-15-job-messages-rls.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rls-behavior:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wazifti_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wazifti_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build schema-faithful isolated Supabase fixture
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d wazifti_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE
            AS $$ SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          
          CREATE TABLE public.profiles (
            id uuid PRIMARY KEY REFERENCES auth.users(id),
            full_name text NOT NULL,
            email text,
            phone text,
            account_type text NOT NULL DEFAULT 'candidate',
            created_at timestamptz DEFAULT now(),
            category_id uuid,
            specialty_id uuid,
            can_post_individual_jobs boolean NOT NULL DEFAULT false
          );
          CREATE TABLE public.companies (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            owner_id uuid NOT NULL REFERENCES public.profiles(id),
            company_name text NOT NULL,
            description text,
            website text,
            status text NOT NULL DEFAULT 'pending'
              CHECK (status IN ('pending','verified','rejected','suspended')),
            created_at timestamptz DEFAULT now()
          );
          CREATE TABLE public.jobs (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            company_id uuid REFERENCES public.companies(id),
            title text NOT NULL,
            description text NOT NULL,
            location text,
            employment_type text,
            salary_min numeric,
            salary_max numeric,
            currency text DEFAULT 'SDG',
            status text NOT NULL DEFAULT 'pending'
              CHECK (status IN ('pending','published','closed','rejected')),
            created_at timestamptz DEFAULT now(),
            category_id uuid,
            specialty_id uuid,
            state text,
            posted_by_user_id uuid REFERENCES public.profiles(id) ON DELETE RESTRICT,
            poster_type text NOT NULL DEFAULT 'company'
              CHECK (poster_type IN ('company','individual')),
            closed_at timestamptz,
            archived_at timestamptz
          );
          CREATE TABLE public.applications (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            job_id uuid NOT NULL REFERENCES public.jobs(id),
            candidate_id uuid NOT NULL REFERENCES public.profiles(id),
            cv_url text,
            cover_letter text,
            status text NOT NULL DEFAULT 'submitted'
              CHECK (status IN ('submitted','reviewing','shortlisted','rejected','accepted')),
            created_at timestamptz DEFAULT now(),
            resume_id uuid,
            UNIQUE (job_id,candidate_id)
          );
          CREATE TABLE public.in_app_notifications (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            user_id uuid NOT NULL REFERENCES auth.users(id) ON DELETE CASCADE,
            application_id uuid NOT NULL REFERENCES public.applications(id) ON DELETE CASCADE,
            job_title text NOT NULL DEFAULT 'الوظيفة',
            old_status text,
            new_status text NOT NULL
              CHECK (new_status IN ('submitted','reviewing','shortlisted','rejected','accepted','message')),
            message text NOT NULL,
            created_at timestamptz NOT NULL DEFAULT now(),
            read_at timestamptz,
            notification_type text NOT NULL DEFAULT 'application_status'
          );
          CREATE TABLE public.job_messages (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            job_id uuid NOT NULL REFERENCES public.jobs(id),
            application_id uuid NOT NULL REFERENCES public.applications(id),
            candidate_id uuid NOT NULL REFERENCES auth.users(id) ON DELETE CASCADE,
            poster_id uuid NOT NULL REFERENCES auth.users(id) ON DELETE CASCADE,
            sender_id uuid NOT NULL REFERENCES auth.users(id) ON DELETE CASCADE,
            recipient_id uuid NOT NULL REFERENCES auth.users(id) ON DELETE CASCADE,
            body text NOT NULL CHECK (char_length(body) BETWEEN 1 AND 3000),
            created_at timestamptz NOT NULL DEFAULT now(),
            read_at timestamptz,
            CONSTRAINT job_messages_distinct_participants CHECK (candidate_id <> poster_id AND sender_id <> recipient_id)
          );
          ALTER TABLE public.job_messages ENABLE ROW LEVEL SECURITY;
          CREATE POLICY "Recipients mark own messages read" ON public.job_messages
            FOR UPDATE TO authenticated
            USING (recipient_id = (SELECT auth.uid()))
            WITH CHECK (recipient_id = (SELECT auth.uid()));
          SQL
      - name: Apply proposed V1.15 migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d wazifti_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261110100000_v1_15_security_performance_hygiene.sql
      - name: Verify indexes and preserved policies
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d wazifti_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE item text;
          BEGIN
            FOREACH item IN ARRAY ARRAY[
              'in_app_notifications_application_id_idx',
              'job_messages_application_id_idx',
              'job_messages_candidate_id_idx',
              'job_messages_poster_id_idx',
              'job_messages_sender_id_idx'
            ] LOOP
              IF NOT EXISTS (SELECT 1 FROM pg_indexes WHERE schemaname='public' AND indexname=item) THEN
                RAISE EXCEPTION 'Missing index: %', item;
              END IF;
            END LOOP;
            IF (SELECT count(*) FROM pg_policies WHERE schemaname='public' AND tablename='job_messages'
                AND policyname IN ('Conversation participants read messages','Conversation participants send messages')
                AND roles @> ARRAY['authenticated']::name[]) <> 2 THEN
              RAISE EXCEPTION 'Expected authenticated SELECT and INSERT policies';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_policies WHERE schemaname='public'
              AND tablename='job_messages' AND policyname='Recipients mark own messages read'
              AND cmd='UPDATE') THEN
              RAISE EXCEPTION 'UPDATE policy missing';
            END IF;
          END $$;
          SQL
      - name: Exercise candidate, company poster, individual poster, and outsider access
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d wazifti_test -v ON_ERROR_STOP=1 -f supabase/tests/v1_15_job_messages_rls.sql
